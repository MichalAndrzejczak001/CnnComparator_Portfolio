plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'com.cnncomparator'
version = '0.0.1-SNAPSHOT'
description = 'logic-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    blackBoxTest {
        java.srcDir 'src/blackBoxTest/java'
        resources.srcDir 'src/blackBoxTest/resources'
        compileClasspath += sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    blackBoxTestImplementation.extendsFrom testImplementation
    blackBoxTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    implementation 'com.mysql:mysql-connector-j'
    // spring-boot-starter-flyway (not just flyway-core) is what actually registers Flyway's
    // autoconfiguration in Spring Boot 4's modularized autoconfigure setup.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'com.h2database:h2'

    testImplementation platform('io.cucumber:cucumber-bom:7.18.1')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'io.rest-assured:json-schema-validator:6.0.1'

    testImplementation 'io.qameta.allure:allure-junit5:2.35.4'
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.35.4'
}

allure {
    version.set('2.35.4')
    adapter {
        autoconfigure.set(true)
    }
    commandline {
        version.set('2.44.1')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('blackBoxTest', Test) {
    description = 'Runs black-box REST Assured tests against a live stack (docker compose up).'
    group = 'verification'
    testClassesDirs = sourceSets.blackBoxTest.output.classesDirs
    classpath = sourceSets.blackBoxTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'blackbox.baseUrl', System.getProperty('blackbox.baseUrl', 'http://localhost:8080')
}
