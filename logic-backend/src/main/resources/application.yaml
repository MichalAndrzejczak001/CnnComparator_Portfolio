spring:
  application:
    name: logic-backend
  servlet:
    multipart:
      # Default is 1MB, which a normal phone photo easily exceeds — Classify/Grad-CAM
      # image uploads would fail with an opaque 413 instead of a useful error.
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

ai-backend:
  url: ${PYTHON_BACKEND_URL}

jwt:
  secret: ${JWT_SECRET}
