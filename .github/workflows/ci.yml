name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-backend/requirements.txt
      # test_loader.py downloads MNIST/FashionMNIST/CIFAR10 on first use; the datasets never
      # change, so re-downloading them on every run just wastes time and adds a dependency on
      # the torchvision mirror being reachable.
      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: ai-backend/data
          key: ai-backend-datasets-v1
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend tests conftest.py
      - name: Run tests
        run: pytest
      - name: Build Docker image
        run: docker build -t ai-backend:ci .

  logic-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'
      - name: Static analysis
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest
      - name: Run tests
        run: ./gradlew test
      - name: Build Docker image
        run: docker build -t logic-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
      - name: E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: 'http://localhost:5173'
      - name: Build Docker image
        run: docker build -t frontend:ci .
